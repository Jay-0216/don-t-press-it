<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f0e7">
<title>DON'T PRESS IT.</title>
<style>
:root{--bg:#f5f0e7;--ink:#151515;--muted:#8f887d;--red:#ff3b30;--sx:0px;--sy:0px;--rot:0deg;--scale:1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{min-height:100dvh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;transition:background .28s ease,filter .2s ease}
main{width:min(94vw,840px);min-height:100dvh;display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;padding:28px 18px;position:relative;isolation:isolate}
.headline-wrap{align-self:end;min-height:5rem;display:grid;place-items:end center;padding-bottom:clamp(30px,6vh,62px);text-align:center;z-index:5}
#headline{margin:0;max-width:88vw;font-size:clamp(1.05rem,2.5vw,1.5rem);line-height:1.18;letter-spacing:.115em;font-weight:650;text-transform:uppercase;transition:.18s ease;user-select:none}
#stage{width:min(78vw,390px);height:min(78vw,390px);display:grid;place-items:center;position:relative;touch-action:manipulation;transform:translate(var(--sx),var(--sy));transition:transform .25s cubic-bezier(.2,.85,.2,1);z-index:4}
#button{appearance:none;-webkit-tap-highlight-color:transparent;border:0;outline:0;padding:0;cursor:pointer;width:68%;height:68%;position:relative;background:linear-gradient(180deg,#ff4a40,#ff3b30 58%,#ee3028);border-radius:50%;clip-path:none;box-shadow:0 15px 36px rgba(255,59,48,.18);transform:rotate(var(--rot)) scale(var(--scale));transition:width .36s cubic-bezier(.2,.9,.2,1),height .36s cubic-bezier(.2,.9,.2,1),border-radius .36s cubic-bezier(.2,.9,.2,1),clip-path .36s cubic-bezier(.2,.9,.2,1),transform .2s cubic-bezier(.2,.9,.2,1),background .24s ease,box-shadow .24s ease,opacity .18s ease}
#button:before{content:"";position:absolute;inset:1px;border-radius:inherit;border:1px solid rgba(255,255,255,.2);pointer-events:none}
#button:hover{--scale:1.035;box-shadow:0 19px 44px rgba(255,59,48,.23)}
#button:active,#button.is-down{--scale:.91;box-shadow:0 8px 20px rgba(255,59,48,.14)}
.shape-circle{width:68%!important;height:68%!important;border-radius:50%!important;clip-path:none!important}
.shape-soft{width:68%!important;height:68%!important;border-radius:29%!important;clip-path:none!important}
.shape-square{width:61%!important;height:61%!important;border-radius:8%!important;clip-path:none!important}
.shape-pill{width:84%!important;height:43%!important;border-radius:999px!important;clip-path:none!important}
.shape-diamond{width:64%!important;height:64%!important;border-radius:0!important;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)!important}
.shape-hex{width:69%!important;height:61%!important;border-radius:0!important;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)!important}
.shape-blob{width:70%!important;height:66%!important;border-radius:61% 39% 53% 47%/46% 58% 42% 54%!important;clip-path:none!important}
.shape-wide{width:86%!important;height:31%!important;border-radius:17px!important;clip-path:none!important}
.shape-tall{width:39%!important;height:82%!important;border-radius:999px!important;clip-path:none!important}
.shape-cut{width:70%!important;height:58%!important;border-radius:0!important;clip-path:polygon(9% 0,91% 0,100% 22%,100% 78%,91% 100%,9% 100%,0 78%,0 22%)!important}
.footer{align-self:start;min-height:4rem;padding-top:clamp(40px,7vh,72px);color:var(--muted);font-size:clamp(.78rem,2vw,.92rem);text-align:center;user-select:none;z-index:5}
#whisper{display:block;min-height:1.5em;margin-top:12px;color:#5f5a53;opacity:0;transform:translateY(3px);transition:.22s ease}
#whisper.visible{opacity:1;transform:none}
.overlay{position:fixed;inset:0;pointer-events:none;opacity:0}
#flash{background:#fff;z-index:30}#blackout{background:#111;z-index:29}
#scan{z-index:28;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.07) 0 1px,transparent 1px 5px);mix-blend-mode:multiply}
#split{z-index:27;background:linear-gradient(90deg,transparent 49.7%,rgba(21,21,21,.55) 49.9% 50.1%,transparent 50.3%)}
.flash-now{animation:flash .19s linear}.blackout-now{animation:blackout .72s steps(2,end)}.scan-now{animation:scan .9s ease}.split-now{animation:split .78s ease}
.shake{animation:shake .31s linear}.hard-shake{animation:hardshake .5s linear}.pulse{animation:pulse .52s cubic-bezier(.2,.9,.2,1)}.squish{animation:squish .48s ease}.blink{animation:blink .52s steps(2,end)}
body.invert{filter:invert(1) hue-rotate(180deg)}body.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body.serif{font-family:Georgia,"Times New Roman",serif}
body.lower #headline{text-transform:lowercase;letter-spacing:.018em;font-weight:400}body.mirror main{transform:scaleX(-1)}body.tint{background:#ede4d8}body.cool{background:#edf0f2}body.cursor-gone,body.cursor-gone *{cursor:none!important}
.ghost{position:fixed;width:130px;height:130px;background:var(--red);border-radius:50%;pointer-events:none;opacity:.22;transform:translate(-50%,-50%);z-index:3;animation:ghostout .62s ease forwards}
.ripple{position:fixed;width:28px;height:28px;border:3px solid var(--red);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);z-index:26;animation:ripple .7s ease-out forwards}
.word{position:fixed;top:-3rem;color:rgba(23,22,21,.62);font:650 12px/1 -apple-system,BlinkMacSystemFont,Arial,sans-serif;letter-spacing:.12em;pointer-events:none;z-index:24;animation:fall 1.7s cubic-bezier(.25,.75,.35,1) forwards}
.loader{position:fixed;left:0;bottom:0;height:3px;width:0;background:var(--red);z-index:31;animation:loader 1.15s cubic-bezier(.1,.7,.2,1) forwards}
.corner{position:fixed;font-size:11px;letter-spacing:.06em;color:#817a70;pointer-events:none;z-index:12;opacity:0;animation:corner 2.2s ease forwards}
@keyframes flash{0%,100%{opacity:0}35%{opacity:.92}}@keyframes blackout{0%,100%{opacity:0}15%,75%{opacity:1}}@keyframes scan{0%,100%{opacity:0}18%,82%{opacity:.72}}@keyframes split{0%,100%{opacity:0}25%,70%{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,3px)}}@keyframes hardshake{0%,100%{transform:none}20%{transform:translate(-11px,6px) rotate(-1deg)}40%{transform:translate(10px,-6px) rotate(1deg)}60%{transform:translate(-8px,-5px) rotate(-.7deg)}80%{transform:translate(8px,5px) rotate(.7deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}45%{transform:scale(1.17)}}@keyframes squish{0%,100%{transform:scale(1)}35%{transform:scale(1.28,.7)}65%{transform:scale(.84,1.15)}}@keyframes blink{0%,35%,70%,100%{opacity:1}15%,50%,85%{opacity:0}}
@keyframes ghostout{to{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}@keyframes ripple{to{width:min(90vw,760px);height:min(90vw,760px);opacity:0;border-width:1px}}@keyframes fall{to{top:110vh;transform:rotate(16deg);opacity:0}}@keyframes loader{0%{width:0}72%{width:89%}90%{width:91%}100%{width:100%;opacity:0}}@keyframes corner{0%,100%{opacity:0}15%,75%{opacity:1}}
@media(max-width:600px){#stage{width:min(89vw,370px);height:min(89vw,370px)}main{padding-inline:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main id="main">
  <div class="headline-wrap"><h1 id="headline">DON'T PRESS IT.</h1></div>
  <section id="stage" aria-label="A suspicious red button"><button id="button" class="shape-circle" aria-label="Do not press this button"></button></section>
  <div class="footer"><span><span id="count">18,392</span> people did.</span><span id="whisper" aria-live="polite"></span></div>
</main>
<div id="flash" class="overlay"></div><div id="blackout" class="overlay"></div><div id="scan" class="overlay"></div><div id="split" class="overlay"></div>
<script>
const q=s=>document.querySelector(s);
const headline=q('#headline'),button=q('#button'),stage=q('#stage'),main=q('#main'),countEl=q('#count'),whisper=q('#whisper');
const flash=q('#flash'),blackout=q('#blackout'),scan=q('#scan'),split=q('#split');
const shapes=['shape-circle','shape-soft','shape-square','shape-pill','shape-diamond','shape-hex','shape-blob','shape-wide','shape-tall','shape-cut'];
const state={clicks:Number(localStorage.getItem('dpi-clicks')||0),visits:Number(localStorage.getItem('dpi-visits')||0)+1,fakeGlobal:Number(localStorage.getItem('dpi-global-demo')||18392),lastInteraction:Date.now(),shapeIndex:0};
localStorage.setItem('dpi-visits',state.visits);countEl.textContent=state.fakeGlobal.toLocaleString();
const lines=new Map([[1,"I SAID DON'T."],[2,'SERIOUSLY?'],[4,"YOU'RE VERY GOOD AT LISTENING."],[7,'FINE.'],[10,'WHY.'],[14,'THIS IS NOT HELPING.'],[19,'...'],[27,'YOU CAN STOP ANY TIME.'],[36,'CAN YOU?'],[50,'OKAY. THAT IS ENOUGH.']]);
if(state.visits>1&&state.clicks>0)setTimeout(()=>say('...YOU AGAIN.'),850);

let audioCtx;
function tone(freq=118,duration=.055,volume=.045){try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.68),audioCtx.currentTime+duration);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch{}}
function say(text){headline.style.opacity='0';headline.style.transform='translateY(4px)';setTimeout(()=>{headline.textContent=text;headline.style.opacity='1';headline.style.transform='translateY(0)'},145)}
function whisperText(text,duration=1800){whisper.textContent=text;whisper.classList.add('visible');setTimeout(()=>whisper.classList.remove('visible'),duration)}
function animate(el,cls,ms=800){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)}
function shape(force){button.classList.remove(...shapes);if(force){state.shapeIndex=shapes.indexOf(force)}else{let n;do{n=Math.floor(Math.random()*shapes.length)}while(n===state.shapeIndex);state.shapeIndex=n}button.classList.add(shapes[state.shapeIndex]);const rs=[-8,-4,0,0,0,4,8];document.documentElement.style.setProperty('--rot',rs[Math.floor(Math.random()*rs.length)]+'deg')}
function dodge(){const x=(Math.random()*2-1)*Math.min(innerWidth*.22,125),y=(Math.random()*2-1)*Math.min(innerHeight*.12,70);stage.style.setProperty('--sx',x+'px');stage.style.setProperty('--sy',y+'px');setTimeout(()=>{stage.style.setProperty('--sx','0px');stage.style.setProperty('--sy','0px')},900)}
function ripple(x,y){const e=document.createElement('div');e.className='ripple';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),750)}
function ghost(x,y){const e=document.createElement('div');e.className='ghost';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),700)}
function rain(){['NO','STOP','WHY',"DON'T",'AGAIN?','PLEASE'].forEach((t,i)=>setTimeout(()=>{const e=document.createElement('div');e.className='word';e.textContent=t;e.style.left=(8+Math.random()*84)+'vw';document.body.appendChild(e);setTimeout(()=>e.remove(),1800)},i*90))}
function loader(){const e=document.createElement('div');e.className='loader';document.body.appendChild(e);setTimeout(()=>e.remove(),1250)}
function corner(text){const e=document.createElement('div');e.className='corner';e.textContent=text;if(Math.random()>.5)e.style.left='18px';else e.style.right='18px';if(Math.random()>.5)e.style.top='18px';else e.style.bottom='18px';document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
function scramble(){const original=headline.textContent,chars='@$#%!?/\\01';let n=0;const id=setInterval(()=>{headline.textContent=[...original].map(c=>c===' '?c:(Math.random()>.55?chars[Math.floor(Math.random()*chars.length)]:c)).join('');if(++n>8){clearInterval(id);headline.textContent=original}},55)}
function randomFx(c){
  const pool=[
    ()=>shape(),()=>animate(button,'pulse',600),()=>animate(button,'squish',560),()=>animate(main,'shake',380),
    ()=>animate(flash,'flash-now',230),()=>{document.body.classList.add('tint');setTimeout(()=>document.body.classList.remove('tint'),900)},
    ()=>{document.body.classList.add('mono');setTimeout(()=>document.body.classList.remove('mono'),1200)},
    ()=>{headline.style.letterSpacing='.32em';setTimeout(()=>headline.style.letterSpacing='',900)},
    ()=>{button.style.opacity='.08';setTimeout(()=>button.style.opacity='1',450)},()=>loader(),()=>corner('that was unnecessary.'),()=>scramble()
  ];
  if(c>10)pool.push(()=>rain(),()=>animate(scan,'scan-now',950),()=>animate(main,'hard-shake',560),()=>dodge());
  if(c>22)pool.push(()=>{document.body.classList.add('mirror');setTimeout(()=>document.body.classList.remove('mirror'),800)},()=>animate(blackout,'blackout-now',780),()=>animate(split,'split-now',850),()=>{document.body.classList.add('invert');setTimeout(()=>document.body.classList.remove('invert'),600)},()=>{document.body.classList.add('cursor-gone');setTimeout(()=>document.body.classList.remove('cursor-gone'),1400)});
  pool[Math.floor(Math.random()*pool.length)]();
}
function scripted(c){
  if(lines.has(c))say(lines.get(c));
  if([3,6,9,13,18,24,31,39,48].includes(c))shape();
  if(c===5)dodge();
  if(c===8){animate(main,'shake',380);whisperText('you missed the instruction.',1600)}
  if(c===11){document.body.classList.add('mono');document.title='stop.';setTimeout(()=>{document.body.classList.remove('mono');document.title="DON'T PRESS IT."},1800)}
  if(c===15)whisperText('someone else just pressed it.',2300);
  if(c===20)whisperText("3 didn't.",1700);
  if(c===25){rain();tone(180,.08,.035)}
  if(c===30){animate(blackout,'blackout-now',780);setTimeout(()=>say('BETTER.'),420)}
  if(c===40){animate(split,'split-now',850);whisperText('something moved.',1500)}
  if(c===60){animate(flash,'flash-now',230);animate(scan,'scan-now',950);animate(main,'hard-shake',560);say('ENOUGH.')}
}
button.addEventListener('click',e=>{state.lastInteraction=Date.now();state.clicks++;state.fakeGlobal++;localStorage.setItem('dpi-clicks',state.clicks);localStorage.setItem('dpi-global-demo',state.fakeGlobal);countEl.textContent=state.fakeGlobal.toLocaleString();tone();if(navigator.vibrate)navigator.vibrate(14);ripple(e.clientX,e.clientY);if(state.clicks%7===0)ghost(e.clientX,e.clientY);scripted(state.clicks);if(state.clicks>2&&Math.random()<Math.min(.18+state.clicks*.004,.38))randomFx(state.clicks)});
let hold;
button.addEventListener('pointerdown',()=>{button.classList.add('is-down');hold=setTimeout(()=>{say("...THAT'S WORSE.");shape('shape-wide');if(navigator.vibrate)navigator.vibrate([25,35,25])},1100)});
['pointerup','pointercancel','pointerleave'].forEach(t=>button.addEventListener(t,()=>{clearTimeout(hold);button.classList.remove('is-down')}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.clicks>=7)document.title='come back.';else if(!document.hidden&&state.clicks>=7){document.title="DON'T PRESS IT.";setTimeout(()=>say('I SAW THAT.'),430)}});
document.addEventListener('contextmenu',e=>{if(state.clicks>8){e.preventDefault();whisperText('looking for something?',1500)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.clicks>5){say('THAT DOES NOT HELP.');animate(headline,'blink',580)}});
setInterval(()=>{const idle=Date.now()-state.lastInteraction;if(state.clicks>=3&&idle>18000&&idle<19500)whisperText('are you done?',2200);if(state.clicks>=12&&idle>42000&&idle<43500)say('...HELLO?')},700);
</script>
</body>
</html>
