<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efe4" />
  <title>DON'T PRESS IT.</title>
  <style>
    :root {
      --bg: #f4efe4;
      --ink: #181716;
      --muted: #8a847a;
      --red: #ed2f2f;
      --red-dark: #a81717;
      --base: #3a3330;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(92vw, 760px);
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      padding: clamp(28px, 5vw, 56px) 20px;
    }

    .headline-wrap {
      align-self: end;
      min-height: 4.5rem;
      display: grid;
      place-items: end center;
      padding-bottom: clamp(32px, 6vh, 64px);
      text-align: center;
    }

    #headline {
      margin: 0;
      font-size: clamp(1.1rem, 2.5vw, 1.55rem);
      line-height: 1.2;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .button-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(72vw, 360px);
      aspect-ratio: 1;
      touch-action: manipulation;
    }

    .button-base {
      position: relative;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 28%, #5a514d 0 12%, transparent 13%),
        linear-gradient(145deg, #4d4541, #26211f);
      box-shadow:
        0 20px 32px rgba(48, 36, 30, 0.22),
        inset 0 2px 4px rgba(255,255,255,0.12),
        inset 0 -8px 14px rgba(0,0,0,0.22);
      transform: translate(var(--x, 0px), var(--y, 0px));
      transition: transform 240ms cubic-bezier(.2,.8,.2,1);
    }

    #button {
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      border: 0;
      width: 78%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 28%, rgba(255,255,255,0.45) 0 7%, transparent 20%),
        radial-gradient(circle at 50% 38%, #ff4b4b 0 18%, var(--red) 52%, #c91d1d 78%, #a91515 100%);
      box-shadow:
        0 17px 0 var(--red-dark),
        0 22px 24px rgba(83, 22, 17, 0.28),
        inset 0 2px 5px rgba(255,255,255,0.35),
        inset 0 -10px 16px rgba(97,0,0,0.18);
      transform: translateY(-8px);
      transition:
        transform 75ms ease,
        box-shadow 75ms ease,
        filter 180ms ease;
    }

    #button:hover {
      filter: brightness(1.025);
    }

    #button:active,
    #button.is-down {
      transform: translateY(8px) scale(0.992);
      box-shadow:
        0 2px 0 var(--red-dark),
        0 6px 11px rgba(83, 22, 17, 0.22),
        inset 0 3px 7px rgba(92,0,0,0.18);
    }

    .footer {
      align-self: start;
      min-height: 4rem;
      padding-top: clamp(40px, 7vh, 72px);
      color: var(--muted);
      font-size: clamp(.78rem, 2vw, .92rem);
      letter-spacing: .02em;
      text-align: center;
      user-select: none;
    }

    #whisper {
      display: block;
      min-height: 1.4em;
      margin-top: 12px;
      color: #5f5a53;
      opacity: 0;
      transition: opacity 250ms ease;
    }

    #whisper.visible { opacity: 1; }

    body.tilt main { transform: rotate(-0.55deg); }
    body.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    @media (max-width: 600px) {
      .button-stage { width: min(88vw, 360px); }
      .button-base { width: 76%; }
      main { padding-inline: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="headline-wrap">
      <h1 id="headline">DON'T PRESS IT.</h1>
    </div>

    <section class="button-stage" id="stage" aria-label="A suspicious red button">
      <div class="button-base" id="base">
        <button id="button" aria-label="Do not press this button"></button>
      </div>
    </section>

    <div class="footer">
      <span><span id="count">18,392</span> people did.</span>
      <span id="whisper" aria-live="polite"></span>
    </div>
  </main>

  <script>
    const headline = document.querySelector('#headline');
    const button = document.querySelector('#button');
    const base = document.querySelector('#base');
    const countEl = document.querySelector('#count');
    const whisper = document.querySelector('#whisper');

    const state = {
      clicks: Number(localStorage.getItem('dpi-clicks') || 0),
      visits: Number(localStorage.getItem('dpi-visits') || 0) + 1,
      fakeGlobal: Number(localStorage.getItem('dpi-global-demo') || 18392),
      lastInteraction: Date.now(),
      dodged: false,
      longPressed: false
    };

    localStorage.setItem('dpi-visits', state.visits);
    countEl.textContent = state.fakeGlobal.toLocaleString();

    const lines = new Map([
      [1, 'I SAID DON\'T.'],
      [2, 'SERIOUSLY?'],
      [4, 'YOU\'RE VERY GOOD AT LISTENING.'],
      [6, 'FINE.'],
      [9, 'THIS ISN\'T A GAME.'],
      [13, '...'],
      [17, 'ARE YOU WAITING FOR SOMETHING?']
    ]);

    if (state.visits > 1 && state.clicks > 0) {
      setTimeout(() => say('...YOU AGAIN.'), 900);
    }

    let audioCtx;
    function clickSound() {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(125, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(82, audioCtx.currentTime + 0.045);
        gain.gain.setValueAtTime(0.055, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.065);
      } catch {}
    }

    function say(text) {
      headline.style.opacity = '0';
      headline.style.transform = 'translateY(4px)';
      setTimeout(() => {
        headline.textContent = text;
        headline.style.opacity = '1';
        headline.style.transform = 'translateY(0)';
      }, 150);
    }

    function whisperText(text, duration = 1800) {
      whisper.textContent = text;
      whisper.classList.add('visible');
      setTimeout(() => whisper.classList.remove('visible'), duration);
    }

    function dodge() {
      const maxX = Math.min(innerWidth * 0.18, 110);
      const maxY = Math.min(innerHeight * 0.08, 55);
      const x = (Math.random() * 2 - 1) * maxX;
      const y = (Math.random() * 2 - 1) * maxY;
      base.style.setProperty('--x', x + 'px');
      base.style.setProperty('--y', y + 'px');
      state.dodged = true;
      setTimeout(() => {
        base.style.setProperty('--x', '0px');
        base.style.setProperty('--y', '0px');
      }, 1150);
    }

    function onPress() {
      state.lastInteraction = Date.now();
      state.clicks += 1;
      state.fakeGlobal += 1;
      localStorage.setItem('dpi-clicks', state.clicks);
      localStorage.setItem('dpi-global-demo', state.fakeGlobal);
      countEl.textContent = state.fakeGlobal.toLocaleString();

      clickSound();
      if (navigator.vibrate) navigator.vibrate(16);

      if (lines.has(state.clicks)) say(lines.get(state.clicks));

      if (state.clicks === 5 && !state.dodged) {
        dodge();
      }

      if (state.clicks === 8) {
        document.body.classList.add('tilt');
        setTimeout(() => document.body.classList.remove('tilt'), 900);
      }

      if (state.clicks === 11) {
        document.body.classList.add('mono');
        document.title = 'stop.';
        setTimeout(() => {
          document.body.classList.remove('mono');
          document.title = "DON'T PRESS IT.";
        }, 2600);
      }

      if (state.clicks === 15) {
        whisperText('someone else just pressed it.', 2300);
      }

      if (state.clicks === 20) {
        whisperText('3 didn\'t.', 1600);
      }
    }

    button.addEventListener('click', onPress);

    let holdTimer;
    const startHold = () => {
      button.classList.add('is-down');
      holdTimer = setTimeout(() => {
        state.longPressed = true;
        say('...THAT\'S WORSE.');
        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
      }, 1200);
    };
    const endHold = () => {
      clearTimeout(holdTimer);
      button.classList.remove('is-down');
    };

    button.addEventListener('pointerdown', startHold);
    button.addEventListener('pointerup', endHold);
    button.addEventListener('pointercancel', endHold);
    button.addEventListener('pointerleave', endHold);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.clicks >= 7) {
        document.title = 'come back.';
      } else if (!document.hidden && state.clicks >= 7) {
        document.title = "DON'T PRESS IT.";
        setTimeout(() => say('I SAW THAT.'), 500);
      }
    });

    setInterval(() => {
      const idleFor = Date.now() - state.lastInteraction;
      if (state.clicks >= 3 && idleFor > 18000 && idleFor < 19500) {
        whisperText('are you done?', 2200);
      }
    }, 700);
  </script>
</body>
</html>
