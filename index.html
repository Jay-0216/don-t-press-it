<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3eee6" />
    <meta name="description" content="Do not press it." />
    <title>DON'T PRESS IT.</title>
  </head>
  <body>
    <main id="app" class="site-shell" aria-live="off">
      <section class="message-zone" aria-live="polite">
        <h1 id="headline">DON'T PRESS IT.</h1>
      </section>

      <section id="stage" class="button-stage" aria-label="A suspicious red button">
        <button id="button" class="danger-button" type="button" aria-label="Do not press this button"></button>
      </section>

      <footer class="footer-zone">
        <div><span id="count">18,392</span> people did.</div>
        <div id="whisper" class="whisper" aria-live="polite"></div>
      </footer>
    </main>

    <div id="veil" class="fx-layer fx-veil"></div>
    <div id="wash" class="fx-layer fx-wash"></div>
    <div id="grain" class="fx-layer fx-grain"></div>
    <div id="leftCurtain" class="fx-curtain fx-curtain-left"></div>
    <div id="rightCurtain" class="fx-curtain fx-curtain-right"></div>
    <div id="tearA" class="fx-tear fx-tear-a"></div>
    <div id="tearB" class="fx-tear fx-tear-b"></div>
    <div id="floatingText" class="floating-text-layer" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
